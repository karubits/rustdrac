# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/), run in CI.

[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu"]
all-features = true

[advisories]
# RustSec database: vulnerabilities, unsound and yanked crates fail the build.
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = [
  # glib 0.18's VariantStrIter is unsound; the app never iterates variant string arrays
  # (it builds variants for the D-Bus notification only). The GTK 3 bindings (gtk 0.18)
  # pin glib 0.18 and have no newer release, so this cannot be upgraded away.
  { id = "RUSTSEC-2024-0429", reason = "VariantStrIter is not used; gtk 0.18 pins glib 0.18" },
]

[licenses]
# Everything here is compatible with shipping Rust Drac under MIT.
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "0BSD",
  "Zlib",
  "BSL-1.0",
  "Unicode-3.0",
  "Unlicense",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
