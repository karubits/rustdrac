[package]
name = "rustdrac"
version = "0.4.1"
edition = "2024"
description = "Rust Drac: Dell iDRAC 8/9 and Supermicro X11 console launcher, address book, health and SEL viewer"
license = "MIT"
authors = ["Karubits <karubits@proton.me>"]
rust-version = "1.88"
readme = "README.md"
repository = "https://github.com/karubits/rustdrac"
homepage = "https://github.com/karubits/rustdrac"
keywords = ["idrac", "dell", "supermicro", "kvm", "redfish"]
categories = ["gui", "network-programming"]
publish = false

[dependencies]
anyhow = "1"
base64 = "0.23.1"
cairo-rs = { version = "0.18", features = ["png"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
# The same GLib API level on every platform (on Linux webkit2gtk pulls these in anyway).
gio = { version = "0.18", features = ["v2_70"] }
glib = { version = "0.18", features = ["v2_70"] }
gtk = "0.18"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "cookies", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
url = "2"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
javascriptcore-rs = "1.1"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
soup3 = "0.5"
webkit2gtk = { version = "2", features = ["v2_40"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "UI_Notifications",
  "Data_Xml_Dom",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
lto = "thin"
