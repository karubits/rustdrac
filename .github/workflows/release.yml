# Release: push a tag vX.Y.Z (scripts/release.sh does it) and this builds the AppImage and
# tarball (Linux) and the installer and portable zip (Windows), then publishes a release
# with them and SHA256SUMS. The release notes are the newest CHANGELOG.md section. Draft
# first, files attached, then published, so "latest" never points at a release without its
# downloads. Finally the winget manifest is submitted (needs the WINGET_TOKEN secret).
name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Build on Debian 12 (glibc 2.36), the oldest supported base: the AppImage runs on
    # systems with the same or newer glibc.
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          [ "$TAG" = "v$version" ] || { echo "tag $TAG does not match Cargo.toml version $version" >&2; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build dependencies and toolchain
        run: scripts/ci-deps.sh

      - name: Tests
        run: cargo test --locked

      - name: Build AppImage and tarball
        run: |
          scripts/install-tools.sh linuxdeploy appimagetool
          scripts/build-appimage.sh

      - name: Smoke-test the AppImage
        run: APPIMAGE_EXTRACT_AND_RUN=1 "dist/rustdrac-$VERSION-x86_64.AppImage" --version

      - name: Release notes (the newest CHANGELOG.md section)
        run: |
          awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2 > dist/NOTES.md
          printf '\n---\nLinux: download **rustdrac-%s-x86_64.AppImage**, `chmod +x` it and run it.\nWindows: run **rustdrac-%s-x86_64-setup.exe** (or `winget install karubits.RustDrac`), or unzip the portable build.\nCheck downloads against `SHA256SUMS`.\n' \
            "$VERSION" "$VERSION" >> dist/NOTES.md

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: MSYS2 with GTK 3 and Rust
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gtk3 mingw-w64-x86_64-rust mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils mingw-w64-x86_64-ntldd
            mingw-w64-x86_64-librsvg zip
      - name: Tests
        run: cargo test --locked
      - name: Build installer and portable zip
        run: scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/
          if-no-files-found: error

  publish:
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the release
    outputs:
      installer_sha256: ${{ steps.sums.outputs.installer_sha256 }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: dist-windows
          path: dist
      - name: Merge checksums
        id: sums
        run: |
          cat dist/SHA256SUMS.windows >> dist/SHA256SUMS && rm dist/SHA256SUMS.windows
          echo "installer_sha256=$(awk '/-setup\.exe$/ { print $1 }' dist/SHA256SUMS)" >> "$GITHUB_OUTPUT"
          cat dist/SHA256SUMS
      - name: Create draft release, attach files, publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          # Remove a leftover draft of this tag from a failed run.
          if gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -q true; then
            echo "Removing leftover draft $TAG"; gh release delete "$TAG" --yes
          fi
          prerelease=""
          case $TAG in *-*) prerelease=--prerelease ;; esac
          gh release create "$TAG" --verify-tag --draft $prerelease \
            --title "Rust Drac $TAG" --notes-file dist/NOTES.md \
            dist/*.AppImage dist/*.tar.gz dist/*-setup.exe dist/*-windows.zip dist/SHA256SUMS
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json url,assets --jq '"Released \(.url) with \(.assets | length) files"'

  winget:
    # Opens the pull request on microsoft/winget-pkgs. Skipped for pre-releases and until
    # the WINGET_TOKEN secret (a classic PAT with public_repo, owner of a winget-pkgs fork)
    # exists.
    needs: publish
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: Render and submit the manifest
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          INSTALLER_SHA256: ${{ needs.publish.outputs.installer_sha256 }}
        run: |
          if (-not $env:WINGET_TOKEN) { Write-Host "WINGET_TOKEN is not set; skipping the winget submission"; exit 0 }
          scripts/winget-submit.ps1 -Version $env:TAG -InstallerSha256 $env:INSTALLER_SHA256 -Token $env:WINGET_TOKEN
