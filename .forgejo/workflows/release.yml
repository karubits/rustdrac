---
# Release: push a tag vX.Y.Z (scripts/release.sh does it) and this builds the AppImage and
# tarball, then publishes a release with them and SHA256SUMS. The release notes are the
# newest CHANGELOG.md section. Draft first, files attached, then published, so "latest"
# never points at a release without its downloads.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: k8s-dmz
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      REPO_TOKEN: ${{ github.token }}
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          [ "$TAG" = "v$version" ] || { echo "tag $TAG does not match Cargo.toml version $version" >&2; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build dependencies and toolchain
        run: scripts/ci-deps.sh

      - name: Tests
        run: cargo test --locked

      - name: Build AppImage and tarball
        run: |
          scripts/install-tools.sh linuxdeploy appimagetool
          scripts/build-appimage.sh

      - name: Smoke-test the AppImage
        run: APPIMAGE_EXTRACT_AND_RUN=1 "dist/rustdrac-$VERSION-x86_64.AppImage" --version

      - name: Create draft release and attach files
        run: |
          set -eu
          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases"
          auth="Authorization: token $REPO_TOKEN"
          # Remove a leftover draft of this tag from a failed run.
          curl -fsS -H "$auth" "$api?draft=true&limit=50" > /tmp/drafts.json
          for id in $(node -e 'const d=require("/tmp/drafts.json");console.log(d.filter(r=>r.draft&&r.tag_name===process.env.TAG).map(r=>r.id).join(" "))'); do
            echo "Removing leftover draft $id"; curl -fsS -X DELETE -H "$auth" "$api/$id"
          done
          # Notes: the newest dated section of CHANGELOG.md.
          awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2 > /tmp/notes.md
          node -e '
            const fs=require("fs"), e=process.env;
            const body=fs.readFileSync("/tmp/notes.md","utf8").trim()+
              "\n\n---\nDownload **rustdrac-"+e.VERSION+"-x86_64.AppImage**, `chmod +x` it and run it. "+
              "Check it against `SHA256SUMS`.";
            fs.writeFileSync("/tmp/release.json", JSON.stringify({tag_name:e.TAG,name:"Rust Drac "+e.TAG,body,draft:true,prerelease:e.TAG.includes("-")}));'
          curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" --data-binary @/tmp/release.json "$api" > /tmp/release-out.json
          id=$(node -e 'console.log(require("/tmp/release-out.json").id)')
          echo "RELEASE_ID=$id" >> "$GITHUB_ENV"
          for f in dist/*.AppImage dist/*.tar.gz dist/SHA256SUMS; do
            curl -fsS -X POST -H "$auth" -F "attachment=@$f" "$api/$id/assets?name=$(basename "$f")" > /dev/null
            echo "Attached $(basename "$f")"
          done

      - name: Publish the release
        run: |
          set -eu
          curl -fsS -X PATCH -H "Authorization: token $REPO_TOKEN" -H "Content-Type: application/json" -d '{"draft": false}' \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID" > /tmp/published.json
          node -e 'const r=require("/tmp/published.json"); if(r.draft||(r.assets||[]).length<3){console.error("unexpected release state");process.exit(1)}
            console.log("Released "+r.tag_name+": "+r.html_url)'
